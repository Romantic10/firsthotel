<!DOCTYPE html>
<html>
    <head>
    <link rel="icon" href="img/00==.png">
    <script src="https://kit.fontawesome.com/1b66dfd1db.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style/style.css">
        <style>
            .a{color:white; font-size: 14pt;}/* class */
            .u{text-decoration: underline;}
            #b{color:brown; font-size: 16pt;}/* id */
            /*element*/
            .heading{
                color: rgba(255, 0, 0, 0.611);
                font-size: 18pt; 
                text-decoration: underline; 
                text-shadow: 2px 3px 3px gray;
                margin: 10px;} 
            span{
                color: rgb(74, 0, 0);
                padding: 30px;
                margin: 30px;
                border: 3px solid rgb(25, 25, 84);
                box-shadow: 2px 3px 1px gray;
                display: inline-block;
                border-radius: 10px;}
            i{
                color: rgb(255, 0, 0)
            }
            span i{
                color: black;
                margin-right: 10px;
            }
            span div{
                font-family: 'poppins', Times, serif;
                font-size: 18pt;
                margin-top: 10px;
                font-weight: bold;
            }
            .first-Row{
                background-color: rgb(255, 169, 169);
                color: rgb(0, 0, 0);
                font-size: 14pt;
            }
            td{
                padding: 15px;
            }
            table{
                background-color: rgb(255, 255, 255);
                border: 2px solid rgb(113, 2, 2);
                box-shadow: 2px 3px 1px gray;
            }
            .checkin {
            color: rgb(39, 255, 57) !important;
            font-size: 12pt;
            padding-right: 5px;
            }
            .pending {
                color: orange !important;
                font-size: 12pt;
                padding-right: 5px;
            }
        </style>
    </head>
    <body>
        <h1>
        <i class="fa-solid fa-key"></i>Administator</h1>
        <div>
            <span><i class="fa-solid fa-briefcase"></i>
                Total Booking
            <div>500$</div>
            </span>
            <span><i class="fa-solid fa-bed"></i>
                Total Room
            <div>300$</div>
            </span>
            <span><i class="fa-solid fa-lock"></i>
                Available Room
            <div>120$</div>
            
            </span>
        </div>
        <div class="heading"><i class="fa-solid fa-rotate"></i>
            Recent Check-Ins
        </div>
        <table width = "100%" rules = "rows" frame = "box" >
            <tr class = "first-Row">
                <td><i class="fa-solid fa-user"></i>Guest Name </td>
                <td><i class="fa-solid fa-bed"></i>Room</td>
                <td><i class="fa-solid fa-info-circle"></i>Status</td>
            </tr>
            <tr>
                <td>Vat Phearom</td>
                <td>SX14</td>
                <td class="checkin"><i class="fa-solid fa-circle"></i>Checked In</td>
            </tr>
            <tr>
                <td>Ouknha Borin</td>
                <td>SX15</td>
                <td class="pending"><i class="fa-solid fa-circle"></i>Pending</td>
            </tr>
            <tr>
                <td>Ekudom Heng</td>
                <td>SX16</td>
                <td class="checkin"><i class="fa-solid fa-circle"></i>Checked In</td>
            </tr>
        </table>





    </body>
    
</html>
