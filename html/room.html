<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SX14</title>
</head>
<body >
    <form>
        <table align="center">
            <caption><h2>Add Room</h2></caption>
            <tr>
                <td><label>Room Number:</label></td>
                <td><input type="number" name="txtRnum" min=1></td>
            </tr>
             <tr>
                <td><label>Room Type:</label></td>
                <td><select name="RType">
                     <option>Single Room</option>
                     <option>Double Room</option>
                     <option>Family Room</option>
                     <option>VIP Room</option>
                </select></td>
            </tr>
             <tr>
                <td><label>Room Price:</label></td>
                <td><input type="number" name="txtRprice" min="30"></td>
            </tr>
             <tr>
                <td><label>Status:</label></td>
                <td><select name="Rstatus">
                    <option>Available</option>
                    <option>Maintenace</option>
                </select></td>
            </tr>
             <tr>
                  <td><label>Submit Here:</label></td>
                <td><input type="submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
